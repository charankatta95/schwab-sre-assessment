apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-b
spec:
  replicas: 3
  selector: { matchLabels: { app: web-app-b } }
  template:
    metadata: { labels: { app: web-app-b } }
    spec:
      containers:
        - name: web-app-b
          image: gcr.io/google-samples/hello-app:2.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: app-b-config }
            - secretRef: { name: app-b-secret }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: web-app-b }
spec:
  selector: { app: web-app-b }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web-app-b-hpa }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web-app-b }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
